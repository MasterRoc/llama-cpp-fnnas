
name: Build llama-cpp FPK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: llama-cpp-build
  cancel-in-progress: false

jobs:

  build-fpk:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. 安装构建环境
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            gzip \
            zstd \
            python3 \
            python3-pil

      # ============================================================
      # 3. 设置脚本权限
      # ============================================================

      - name: Make scripts executable
        run: |
          set -euo pipefail

          chmod +x prepare.sh
          chmod +x build.sh

      # ============================================================
      # 4. 获取 llama.cpp 最新版本
      #
      # llama.cpp 使用：
      #
      # b10696
      # b10695
      # b10694
      #
      # 这些版本可能属于 Pre-release。
      #
      # 不能使用：
      #
      # /releases/latest
      #
      # 因为它只返回正式 Release。
      #
      # 这里直接读取：
      #
      # /releases?per_page=100
      #
      # 然后只匹配：
      #
      # b数字
      #
      # 最终取数字最大的版本。
      # ============================================================

      - name: Get latest llama.cpp version
        id: llama-version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Detecting llama.cpp version"
          echo "========================================"

          API_URL="https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100"

          echo ""
          echo "Downloading release list..."
          echo "${API_URL}"
          echo ""

          RELEASE_JSON="$(
            curl \
              -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              --connect-timeout 30 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}"
          )"

          if [ -z "${RELEASE_JSON}" ]; then
            echo "ERROR: GitHub API returned empty response."
            exit 1
          fi

          LLAMA_CPP_VER="$(
            printf '%s' "${RELEASE_JSON}" |
            python3 -c '
          import sys
          import json
          import re

          data = json.load(sys.stdin)

          versions = []

          for release in data:

              tag = release.get("tag_name", "")

              match = re.fullmatch(r"b([0-9]+)", tag)

              if match:
                  number = int(match.group(1))
                  versions.append((number, tag))

          if not versions:
              raise SystemExit(
                  "ERROR: No bXXXXX llama.cpp releases found."
              )

          versions.sort(
              key=lambda item: item[0],
              reverse=True
          )

          print(versions[0][1])
          '
          )"

          if [ -z "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: Failed to detect llama.cpp version."
            exit 1
          fi

          if ! printf '%s\n' "${LLAMA_CPP_VER}" | grep -Eq '^b[0-9]+$'; then
            echo "ERROR: Unexpected llama.cpp version:"
            echo "${LLAMA_CPP_VER}"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo " Latest llama.cpp:"
          echo " ${LLAMA_CPP_VER}"
          echo "========================================"
          echo ""

          echo "Recent versions:"

          printf '%s' "${RELEASE_JSON}" |
          python3 -c '
          import sys
          import json
          import re

          data = json.load(sys.stdin)

          versions = []

          for release in data:

              tag = release.get("tag_name", "")

              match = re.fullmatch(r"b([0-9]+)", tag)

              if match:
                  versions.append(
                      (int(match.group(1)), tag)
                  )

          versions.sort(
              key=lambda item: item[0],
              reverse=True
          )

          for _, tag in versions[:10]:
              print("  " + tag)
          '

          echo ""

          echo "LLAMA_CPP_VER=${LLAMA_CPP_VER}" >> "${GITHUB_ENV}"

          echo "version=${LLAMA_CPP_VER}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 5. Prepare
      #
      # prepare.sh:
      #
      # - 下载 fnpack
      # - 下载 x64 Vulkan
      # - 下载 arm64 Vulkan
      # - 下载 WebUI
      # - 创建 app/VERSION
      # - 更新 app/manifest
      # ============================================================

      - name: Prepare dependencies
        env:
          FNPACK_VER: "1.2.3"
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Preparing dependencies"
          echo "========================================"

          echo ""
          echo "llama.cpp: ${LLAMA_CPP_VER}"
          echo "fnpack: ${FNPACK_VER}"
          echo ""

          ./prepare.sh

      # ============================================================
      # 6. 检查依赖
      # ============================================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " fnpack"
          echo "========================================"

          if [ ! -f "./fnpack" ]; then
            echo "ERROR: fnpack not found."
            exit 1
          fi

          ls -lh ./fnpack

          echo ""
          echo "========================================"
          echo " app/VERSION"
          echo "========================================"

          if [ ! -f "./app/VERSION" ]; then
            echo "ERROR: app/VERSION not found."
            exit 1
          fi

          cat ./app/VERSION

          echo ""
          echo "========================================"
          echo " app/manifest"
          echo "========================================"

          if [ ! -f "./app/manifest" ]; then
            echo "ERROR: app/manifest not found."
            exit 1
          fi

          cat ./app/manifest

          echo ""
          echo "========================================"
          echo " x64"
          echo "========================================"

          if [ ! -f "./app/bin/x64/llama-server" ]; then
            echo "ERROR: x64 llama-server not found."
            exit 1
          fi

          if [ ! -f "./app/bin/x64/libggml-vulkan.so" ]; then
            echo "ERROR: x64 Vulkan library not found."
            exit 1
          fi

          find ./app/bin/x64 -type f -print

          echo ""
          echo "========================================"
          echo " arm64"
          echo "========================================"

          if [ ! -f "./app/bin/arm64/llama-server" ]; then
            echo "ERROR: arm64 llama-server not found."
            exit 1
          fi

          if [ ! -f "./app/bin/arm64/libggml-vulkan.so" ]; then
            echo "ERROR: arm64 Vulkan library not found."
            exit 1
          fi

          find ./app/bin/arm64 -type f -print

          echo ""
          echo "========================================"
          echo " WebUI"
          echo "========================================"

          if [ ! -f "./app/webui/index.html" ]; then
            echo "ERROR: WebUI index.html not found."
            exit 1
          fi

          find ./app/webui -type f -print | head -100

          echo ""
          echo "Dependency verification successful."

      # ============================================================
      # 7. 构建 FPK
      # ============================================================

      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Building FPK"
          echo "========================================"

          ./build.sh

      # ============================================================
      # 8. 检查 FPK
      # ============================================================

      - name: Verify FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " FPK result"
          echo "========================================"

          if [ ! -d "./dist" ]; then
            echo "ERROR: dist directory not found."
            exit 1
          fi

          ls -lah ./dist

          FPK_COUNT="$(
            find ./dist \
              -maxdepth 1 \
              -type f \
              -name "*.fpk" |
            wc -l
          )"

          echo ""
          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No .fpk file generated."
            exit 1
          fi

          echo ""
          echo "FPK build successful."

      # ============================================================
      # 9. Build Summary
      # ============================================================

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## llama.cpp FPK Build"
            echo ""
            echo "### llama.cpp"
            echo "- Version: ${LLAMA_CPP_VER}"
            echo ""
            echo "### fnpack"
            echo "- Version: 1.2.3"
            echo ""
            echo "### Architecture"
            echo "- x86_64 Vulkan"
            echo "- ARM64 Vulkan"
            echo ""
            echo "### WebUI"
            echo "- Included"
            echo ""
            echo "### FPK"
          } >> "${GITHUB_STEP_SUMMARY}"

          for file in dist/*.fpk; do

            echo "- $(basename "${file}")" \
              >> "${GITHUB_STEP_SUMMARY}"

            ls -lh "${file}" \
              >> "${GITHUB_STEP_SUMMARY}"

          done

      # ============================================================
      # 10. 上传 Artifact
      # ============================================================

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-fnnas-${{ env.LLAMA_CPP_VER }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 11. 创建 GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ env.LLAMA_CPP_VER }}

          name: llama.cpp ${{ env.LLAMA_CPP_VER }} fnOS FPK

          generate_release_notes: true

          body: |
            # llama.cpp fnOS FPK

            自动跟随 llama.cpp 上游最新 `bXXXXX` 版本构建。

            ## Version

            - llama.cpp: `${{ env.LLAMA_CPP_VER }}`
            - fnpack: `1.2.3`

            ## Architecture

            - x86_64
            - ARM64

            ## GPU

            - Vulkan

            ## WebUI

            - Included

            ## Source

            https://github.com/ggml-org/llama.cpp

            ## Build

            - GitHub Actions Run: #${{ github.run_number }}
            - Commit: `${{ github.sha }}`

          files: |
            dist/*.fpk

          fail_on_unmatched_files: true


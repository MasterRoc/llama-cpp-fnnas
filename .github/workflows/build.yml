```yaml
name: Build llama-cpp FPK

on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  FNPACK_VER: "1.2.3"

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ========================================
      # 1. 获取源码
      # ========================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ========================================
      # 2. 安装构建环境
      # ========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            gzip \
            python3 \
            python3-pil


      # ========================================
      # 3. 设置脚本执行权限
      # ========================================

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x prepare.sh
          chmod +x build.sh


      # ========================================
      # 4. 获取 llama.cpp 最新版本
      #
      # 上游版本格式：
      #
      # b10694
      # b10695
      # b10696
      #
      # 不使用 v0.x.x
      # ========================================

      - name: Get llama.cpp version
        id: llama-version
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting latest llama.cpp release..."

          LLAMA_CPP_VER=$(curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')

          if [ -z "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: Failed to get llama.cpp version"
            exit 1
          fi

          # 检查是否为 bXXXXX 格式
          if ! echo "${LLAMA_CPP_VER}" | grep -Eq '^b[0-9]+$'; then
            echo "ERROR: Unexpected llama.cpp version: ${LLAMA_CPP_VER}"
            exit 1
          fi

          echo "========================================"
          echo "Latest llama.cpp: ${LLAMA_CPP_VER}"
          echo "========================================"

          echo "LLAMA_CPP_VER=${LLAMA_CPP_VER}" >> "$GITHUB_ENV"
          echo "version=${LLAMA_CPP_VER}" >> "$GITHUB_OUTPUT"


      # ========================================
      # 5. 显示版本信息
      # ========================================

      - name: Show build versions
        shell: bash
        run: |
          echo "========================================"
          echo "llama.cpp : ${LLAMA_CPP_VER}"
          echo "fnpack    : ${FNPACK_VER}"
          echo "========================================"


      # ========================================
      # 6. 下载依赖
      #
      # prepare.sh：
      #
      # - fnpack
      # - llama.cpp x86_64 Vulkan
      # - llama.cpp arm64 Vulkan
      # - WebUI
      # ========================================

      - name: Prepare dependencies
        shell: bash
        env:
          LLAMA_CPP_VER: ${{ env.LLAMA_CPP_VER }}
          FNPACK_VER: ${{ env.FNPACK_VER }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing dependencies"
          echo "llama.cpp: ${LLAMA_CPP_VER}"
          echo "fnpack: ${FNPACK_VER}"
          echo "========================================"

          ./prepare.sh


      # ========================================
      # 7. 检查依赖
      # ========================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "===== fnpack ====="

          if [ -e "./fnpack" ]; then
            ls -lah ./fnpack
            ./fnpack --version || true
          else
            echo "WARNING: fnpack not found"
          fi


          echo ""
          echo "===== app/bin ====="

          if [ -d "./app/bin" ]; then
            find ./app/bin -type f -print
          else
            echo "WARNING: app/bin not found"
          fi


          echo ""
          echo "===== app/webui ====="

          if [ -d "./app/webui" ]; then
            find ./app/webui -type f -print | head -100
          else
            echo "WARNING: app/webui not found"
          fi


          echo ""
          echo "===== app structure ====="

          if [ -d "./app" ]; then
            find ./app -maxdepth 4 -type f -print
          else
            echo "ERROR: app directory not found"
            exit 1
          fi


      # ========================================
      # 8. 构建 FPK
      # ========================================

      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building llama.cpp ${LLAMA_CPP_VER}"

          ./build.sh


      # ========================================
      # 9. 检查 FPK
      # ========================================

      - name: Verify FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== dist ====="

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist"
            exit 1
          fi

          ls -lah dist/

          FPK_COUNT=$(find dist -maxdepth 1 -type f -name "*.fpk" | wc -l)

          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No .fpk file generated!"
            exit 1
          fi

          echo "FPK build successful."


      # ========================================
      # 10. GitHub Actions Summary
      # ========================================

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Build completed successfully"
            echo ""
            echo "### llama.cpp"
            echo "- Version: \`${LLAMA_CPP_VER}\`"
            echo ""
            echo "### fnpack"
            echo "- Version: \`${FNPACK_VER}\`"
            echo ""
            echo "### Build"
            echo "- Run: #${GITHUB_RUN_NUMBER}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "### Architecture"
            echo "- x86_64"
            echo "- arm64"
            echo ""
            echo "### FPK files"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in dist/*.fpk; do
            if [ -f "$file" ]; then
              echo "- $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
            fi
          done


      # ========================================
      # 11. 上传 Artifact
      # ========================================

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-fnnas-${{ env.LLAMA_CPP_VER }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30


      # ========================================
      # 12. 创建 GitHub Release
      # ========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-${{ env.LLAMA_CPP_VER }}-build-${{ github.run_number }}
          name: llama.cpp ${{ env.LLAMA_CPP_VER }} fnOS FPK

          body: |
            ## llama.cpp fnOS FPK

            自动构建版本。

            ### llama.cpp

            - Version: ${{ env.LLAMA_CPP_VER }}
            - Upstream: ggml-org/llama.cpp

            ### fnpack

            - Version: 1.2.3

            ### Build

            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}

            ### Architecture

            - x86_64
            - arm64

            ### Upstream Release

            https://github.com/ggml-org/llama.cpp/releases/tag/${{ env.LLAMA_CPP_VER }}

          files: |
            dist/*.fpk

          fail_on_unmatched_files: true
```

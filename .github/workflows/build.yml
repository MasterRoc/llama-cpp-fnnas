name: Build llama-cpp FPK

on:
  workflow_dispatch:
    

  push:
    branches:
      - main

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ========================================
      # 1. 获取源码
      # ========================================

      - name: Checkout source
        uses: actions/checkout@v4

      # ========================================
      # 2. 安装构建环境
      # ========================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            tar \
            gzip \
            python3 \
            python3-pil

      # ========================================
      # 3. 设置脚本执行权限
      # ========================================

      - name: Make scripts executable
        run: |
          chmod +x prepare.sh
          chmod +x build.sh

      # ========================================
      # 4. 获取 llama.cpp 版本
      #
      # 手动填写版本：
      #   b10612
      #
      # 留空：
      #   自动获取 ggml-org/llama.cpp 最新 Release
      # ========================================

      - name: Get llama.cpp version
        id: llama-version
        
        run: |
          set -e

          if [ -n "${LLAMA_CPP_VER_INPUT}" ]; then
            LLAMA_CPP_VER="${LLAMA_CPP_VER_INPUT}"
            echo "Using manually specified llama.cpp version: ${LLAMA_CPP_VER}"
          else
            echo "Getting latest llama.cpp release..."

            LLAMA_CPP_VER=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')

            if [ -z "${LLAMA_CPP_VER}" ]; then
              echo "ERROR: Failed to get latest llama.cpp version"
              exit 1
            fi

            echo "Latest llama.cpp release: ${LLAMA_CPP_VER}"
          fi

          echo "LLAMA_CPP_VER=${LLAMA_CPP_VER}" >> "$GITHUB_ENV"
          echo "version=${LLAMA_CPP_VER}" >> "$GITHUB_OUTPUT"

      # ========================================
      # 5. 下载项目依赖
      #
      # prepare.sh 会下载：
      # - fnpack
      # - llama.cpp x64 Vulkan
      # - llama.cpp arm64 Vulkan
      # - WebUI
      # ========================================

      - name: Prepare dependencies
        env:
          FNPACK_VER: "1.2.3"
        run: |
          set -e

          echo "========================================"
          echo "llama.cpp version: ${LLAMA_CPP_VER}"
          echo "fnpack version: ${FNPACK_VER}"
          echo "========================================"

          ./prepare.sh

      # ========================================
      # 6. 检查依赖是否完整
      # ========================================

      - name: Verify dependencies
  shell: bash
  run: |
    echo "===== fnpack ====="
    ls -lah ./fnpack || true
    ./fnpack --version || true

    echo ""
    echo "===== app/bin ====="
    find ./app/bin -type f -print 2>/dev/null || true

    echo ""
    echo "===== app/webui ====="
    find ./app/webui -type f -print 2>/dev/null | head -100 || true

    echo ""
    echo "===== directory structure ====="
    find ./app -maxdepth 3 -type f -print 2>/dev/null || true

    echo ""
    echo "Dependency verification finished."

      # ========================================
      # 7. 打包 FPK
      # ========================================

      - name: Build FPK
        run: |
          set -e

          ./build.sh

      # ========================================
      # 8. 检查最终 FPK
      # ========================================

      - name: Verify FPK
        run: |
          set -e

          echo "===== dist ====="
          ls -lah dist/

          FPK_COUNT=$(find dist -maxdepth 1 -type f -name "*.fpk" | wc -l)

          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No .fpk file generated!"
            exit 1
          fi

          echo ""
          echo "FPK build successful."

      # ========================================
      # 9. 构建信息
      # ========================================

      - name: Build summary
        run: |
          echo "## Build completed successfully" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### llama.cpp" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${LLAMA_CPP_VER}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### fnpack" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ github.event.inputs.fnpack_ver || '1.2.3' }}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### FPK files" >> "$GITHUB_STEP_SUMMARY"

          for file in dist/*.fpk; do
            echo "- $(basename "$file")" >> "$GITHUB_STEP_SUMMARY"
            ls -lh "$file" >> "$GITHUB_STEP_SUMMARY"
          done

      # ========================================
      # 10. 上传 FPK 到 Actions Artifact
      # ========================================

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-fnnas-${{ env.LLAMA_CPP_VER }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

      # ========================================
      # 11. 创建 GitHub Release
      # ========================================

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-${{ env.LLAMA_CPP_VER }}-build-${{ github.run_number }}
          name: llama.cpp ${{ env.LLAMA_CPP_VER }} fnOS FPK
          body: |
            ## llama.cpp fnOS FPK

            自动构建版本。

            - llama.cpp: ${{ env.LLAMA_CPP_VER }}
            - fnpack: ${{ github.event.inputs.fnpack_ver || '1.2.3' }}
            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}

            架构：

            - x86_64
            - arm64

            llama.cpp 版本自动跟随上游：
            https://github.com/ggml-org/llama.cpp/releases
          files: |
            dist/*.fpk
          fail_on_unmatched_files: true

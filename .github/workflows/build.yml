
name: Build llama-cpp FPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: llama-cpp-fpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FNPACK_VER: "1.2.3"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            ca-certificates \
            tar \
            gzip \
            unzip \
            python3 \
            python3-pil

      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./prepare.sh
          test -f ./build.sh

          chmod +x ./prepare.sh
          chmod +x ./build.sh

      - name: Detect latest llama.cpp version
        id: llama_version
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Detecting latest llama.cpp version"
          echo "============================================================"

          API_URL="https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100"
          RELEASE_JSON="/tmp/llama-releases.json"

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RELEASE_JSON}" \
            "${API_URL}"

          if [ ! -s "${RELEASE_JSON}" ]; then
            echo "ERROR: GitHub API returned empty response."
            exit 1
          fi

          LLAMA_CPP_VER="$(
            python3 - "${RELEASE_JSON}" <<'PY'
import json
import re
import sys

with open(sys.argv[1], "r", encoding="utf-8") as f:
    releases = json.load(f)

if not isinstance(releases, list):
    raise SystemExit("GitHub API response is not a release list")

versions = []

for release in releases:
    if not isinstance(release, dict):
        continue

    tag = str(release.get("tag_name", "")).strip()

    match = re.fullmatch(r"b([0-9]+)", tag)

    if match:
        versions.append((int(match.group(1)), tag))

if not versions:
    raise SystemExit("No bXXXXX release found")

versions.sort(key=lambda item: item[0], reverse=True)

print(versions[0][1])
PY
          )"

          if ! printf '%s' "${LLAMA_CPP_VER}" | grep -Eq '^b[0-9]+$'; then
            echo "ERROR: Unexpected llama.cpp version: ${LLAMA_CPP_VER}"
            exit 1
          fi

          echo "Latest llama.cpp version: ${LLAMA_CPP_VER}"

          echo "LLAMA_CPP_VER=${LLAMA_CPP_VER}" >> "${GITHUB_ENV}"
          echo "version=${LLAMA_CPP_VER}" >> "${GITHUB_OUTPUT}"

      - name: Show build information
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Build information"
          echo "============================================================"
          echo "llama.cpp: ${LLAMA_CPP_VER}"
          echo "fnpack: ${FNPACK_VER}"
          echo "commit: ${GITHUB_SHA}"
          echo "run: #${GITHUB_RUN_NUMBER}"

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing dependencies"
          echo "============================================================"

          ./prepare.sh

      - name: Verify app VERSION
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking app/VERSION"
          echo "============================================================"

          if [ ! -f "./app/VERSION" ]; then
            echo "ERROR: app/VERSION not found."
            exit 1
          fi

          echo ""
          cat ./app/VERSION
          echo ""

          APP_VERSION="$(tr -d '\r\n ' < ./app/VERSION)"

          echo "Expected: ${LLAMA_CPP_VER}"
          echo "Actual:   ${APP_VERSION}"

          if [ "${APP_VERSION}" != "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: app/VERSION mismatch."
            exit 1
          fi

          echo "app/VERSION verified."

      - name: Verify app manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking app/manifest"
          echo "============================================================"

          if [ ! -f "./app/manifest" ]; then
            echo "ERROR: app/manifest not found."
            exit 1
          fi

          echo ""
          cat ./app/manifest
          echo ""

          MANIFEST_VERSION="$(
            sed -n 's/^version=//p' ./app/manifest |
            head -n 1 |
            tr -d '\r'
          )"

          echo "Expected: ${LLAMA_CPP_VER}"
          echo "Actual:   ${MANIFEST_VERSION}"

          if [ "${MANIFEST_VERSION}" != "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: app/manifest version mismatch."
            exit 1
          fi

          echo "app/manifest verified."

      - name: Verify llama.cpp binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking llama.cpp binaries"
          echo "============================================================"

          for ARCH in x64 arm64; do
            DIR="./app/bin/${ARCH}"

            echo ""
            echo "Architecture: ${ARCH}"

            if [ ! -d "${DIR}" ]; then
              echo "ERROR: Directory not found: ${DIR}"
              exit 1
            fi

            if [ ! -f "${DIR}/llama-server" ]; then
              echo "ERROR: llama-server not found in ${DIR}"
              exit 1
            fi

            if [ ! -f "${DIR}/libggml-vulkan.so" ]; then
              echo "ERROR: libggml-vulkan.so not found in ${DIR}"
              exit 1
            fi

            echo "llama-server:"
            ls -lh "${DIR}/llama-server"

            echo "libggml-vulkan.so:"
            ls -lh "${DIR}/libggml-vulkan.so"
          done

          echo ""
          echo "All llama.cpp binaries verified."

      - name: Verify WebUI
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking WebUI"
          echo "============================================================"

          if [ ! -d "./app/webui" ]; then
            echo "ERROR: app/webui not found."
            exit 1
          fi

          if [ ! -f "./app/webui/index.html" ]; then
            echo "ERROR: app/webui/index.html not found."
            exit 1
          fi

          echo "WebUI verified."

          echo ""
          echo "WebUI file count:"
          find ./app/webui -type f | wc -l

      - name: Verify fnpack
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking fnpack"
          echo "============================================================"

          if [ -x "./fnpack" ]; then
            ls -lh ./fnpack
            ./fnpack --help || true
          else
            echo "ERROR: ./fnpack not found."
            exit 1
          fi

      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building FPK"
          echo "============================================================"

          ./build.sh

      - name: Verify FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking FPK"
          echo "============================================================"

          if [ ! -d "./dist" ]; then
            echo "ERROR: dist directory not found."
            exit 1
          fi

          FPK_COUNT="$(
            find ./dist \
              -maxdepth 1 \
              -type f \
              -name "*.fpk" |
            wc -l
          )"

          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No .fpk file generated."
            exit 1
          fi

          echo ""
          echo "Generated FPK files:"
          find ./dist \
            -maxdepth 1 \
            -type f \
            -name "*.fpk" \
            -print |
          sort

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# llama.cpp FPK Build"
            echo ""
            echo "## Build information"
            echo ""
            echo "- llama.cpp: \`${LLAMA_CPP_VER}\`"
            echo "- fnpack: \`${FNPACK_VER}\`"
            echo "- Build: \`#${GITHUB_RUN_NUMBER}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "## Architectures"
            echo ""
            echo "- x86_64"
            echo "- arm64"
            echo ""
            echo "## FPK files"
            echo ""

            for FILE in ./dist/*.fpk; do
              if [ -f "${FILE}" ]; then
                SIZE="$(du -h "${FILE}" | cut -f1)"
                echo "- \`$(basename "${FILE}")\` — ${SIZE}"
              fi
            done

          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-fnnas-${{ env.LLAMA_CPP_VER }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-${{ env.LLAMA_CPP_VER }}
          name: llama.cpp ${{ env.LLAMA_CPP_VER }} fnOS FPK
          body: |
            # llama.cpp fnOS FPK

            自动构建版本。

            ## Version

            - llama.cpp: `${{ env.LLAMA_CPP_VER }}`
            - fnpack: `${{ env.FNPACK_VER }}`

            ## Architectures

            - x86_64
            - arm64

            ## GPU

            Vulkan GPU acceleration.

            ## Features

            - GGUF model support
            - OpenAI-compatible API
            - OpenAI-compatible API
            - Built-in WebUI

            ## Upstream

            https://github.com/ggml-org/llama.cpp

            ## Build

            - GitHub Actions Run: #${{ github.run_number }}
            - Commit: `${{ github.sha }}`

          files: |
            dist/*.fpk

          fail_on_unmatched_files: true
          generate_release_notes: true

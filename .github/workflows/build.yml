
name: Build llama-cpp FPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FNPACK_VER: "1.2.3"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget ca-certificates tar gzip unzip python3 python3-pil

      - name: Make scripts executable
        run: |
          chmod +x prepare.sh
          chmod +x build.sh

      - name: Get latest llama.cpp version
        id: version
        run: |
          set -e

          echo "Getting llama.cpp releases..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --connect-timeout 30 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100" \
            -o /tmp/releases.json

          LLAMA_CPP_VER=$(python3 -c '
          import json
          import re

          with open("/tmp/releases.json", "r", encoding="utf-8") as f:
              releases = json.load(f)

          versions = []

          for release in releases:
              tag = release.get("tag_name", "")

              if re.fullmatch(r"b[0-9]+", tag):
                  versions.append(tag)

          if not versions:
              raise SystemExit("No bXXXXX version found")

          versions.sort(key=lambda x: int(x[1:]), reverse=True)

          print(versions[0])
          ')

          echo "Detected llama.cpp version: ${LLAMA_CPP_VER}"

          if ! echo "${LLAMA_CPP_VER}" | grep -Eq '^b[0-9]+$'; then
            echo "ERROR: Invalid llama.cpp version"
            exit 1
          fi

          echo "LLAMA_CPP_VER=${LLAMA_CPP_VER}" >> "$GITHUB_ENV"
          echo "version=${LLAMA_CPP_VER}" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "========================================"
          echo "llama.cpp version: ${LLAMA_CPP_VER}"
          echo "fnpack version: ${FNPACK_VER}"
          echo "========================================"

      - name: Prepare dependencies
        run: |
          set -e

          ./prepare.sh

      - name: Verify VERSION
        run: |
          set -e

          echo "===== app/VERSION ====="

          if [ ! -f app/VERSION ]; then
            echo "ERROR: app/VERSION not found"
            exit 1
          fi

          cat app/VERSION

          APP_VERSION=$(tr -d '[:space:]' < app/VERSION)

          echo "Expected: ${LLAMA_CPP_VER}"
          echo "Actual: ${APP_VERSION}"

          if [ "${APP_VERSION}" != "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: app/VERSION mismatch"
            exit 1
          fi

      - name: Verify manifest
        run: |
          set -e

          echo "===== app/manifest ====="

          if [ ! -f app/manifest ]; then
            echo "ERROR: app/manifest not found"
            exit 1
          fi

          cat app/manifest

          MANIFEST_VERSION=$(grep '^version=' app/manifest | head -n 1 | cut -d '=' -f 2 | tr -d '\r')

          echo "Expected: ${LLAMA_CPP_VER}"
          echo "Actual: ${MANIFEST_VERSION}"

          if [ "${MANIFEST_VERSION}" != "${LLAMA_CPP_VER}" ]; then
            echo "ERROR: manifest version mismatch"
            exit 1
          fi

      - name: Verify x64 Vulkan
        run: |
          set -e

          test -f app/bin/x64/llama-server
          test -f app/bin/x64/libggml-vulkan.so

          echo "x64 Vulkan OK"

      - name: Verify arm64 Vulkan
        run: |
          set -e

          test -f app/bin/arm64/llama-server
          test -f app/bin/arm64/libggml-vulkan.so

          echo "arm64 Vulkan OK"

      - name: Verify WebUI
        run: |
          set -e

          test -f app/webui/index.html

          echo "WebUI OK"

      - name: Verify fnpack
        run: |
          set -e

          test -x ./fnpack

          ./fnpack --help

      - name: Build FPK
        run: |
          set -e

          ./build.sh

      - name: Verify FPK
        run: |
          set -e

          test -d dist

          FPK_COUNT=$(find dist -maxdepth 1 -type f -name "*.fpk" | wc -l)

          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No FPK generated"
            exit 1
          fi

          find dist -maxdepth 1 -type f -name "*.fpk" -print

      - name: Upload FPK
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-fnnas-${{ env.LLAMA_CPP_VER }}
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-${{ env.LLAMA_CPP_VER }}
          name: llama.cpp ${{ env.LLAMA_CPP_VER }} fnOS FPK
          body: |
            llama.cpp fnOS FPK

            llama.cpp version: ${{ env.LLAMA_CPP_VER }}
            fnpack version: ${{ env.FNPACK_VER }}

            Architecture:
            - x86_64
            - arm64

            GPU:
            Vulkan

            Upstream:
            https://github.com/ggml-org/llama.cpp

            Build:
            #${{ github.run_number }}

          files: dist/*.fpk
          fail_on_unmatched_files: true
          generate_release_notes: true

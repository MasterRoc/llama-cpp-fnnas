name: Check llama.cpp upstream

on:
  schedule:
    # 每 30 分钟检查一次
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest llama.cpp release
        id: check
        run: |
          set -e

          echo "Checking latest llama.cpp release..."

          LATEST_VERSION=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')

          echo "Latest upstream version: ${LATEST_VERSION}"

          if [ -z "${LATEST_VERSION}" ]; then
            echo "ERROR: Failed to get latest llama.cpp version"
            exit 1
          fi

          echo "latest=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -e

          TAG_PREFIX="llama-${LATEST_VERSION}-build-"

          echo "Checking existing releases..."
          echo "Tag prefix: ${TAG_PREFIX}"

          EXISTING=$(gh release list \
            --limit 100 \
            --json tagName \
            --jq ".[] | select(.tagName | startswith(\"${TAG_PREFIX}\")) | .tagName")

          if [ -n "${EXISTING}" ]; then
            echo "Version ${LATEST_VERSION} has already been built."
            echo "${EXISTING}"

            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${LATEST_VERSION} has not been built."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -e

          echo "========================================"
          echo "New llama.cpp version detected!"
          echo "Version: ${LATEST_VERSION}"
          echo "========================================"

          gh workflow run build.yml \
            --ref main \
            -f llama_cpp_ver="${LATEST_VERSION}"

          echo "Build workflow triggered successfully."

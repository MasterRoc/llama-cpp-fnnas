name: Check llama.cpp upstream

on:
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Check latest llama.cpp version
        id: upstream
        shell: bash
        run: |
          set -e

          echo "Checking llama.cpp upstream..."

          VERSION=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')

          echo "Latest version: ${VERSION}"

          if [ -z "${VERSION}" ]; then
            echo "Failed to get llama.cpp version"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -e

          echo "Checking existing release..."

          if gh release list \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | grep -q "^llama-${VERSION}-"; then

            echo "Version ${VERSION} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "Version ${VERSION} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Trigger build workflow
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "New llama.cpp version detected"
          echo "Version: ${VERSION}"
          echo "========================================"

          gh workflow run build.yml \
            --ref main \
            -f llama_cpp_ver="${VERSION}"

          echo "Build workflow triggered."

      - name: No build required
        if: steps.release.outputs.exists == 'true'
        run: |
          echo "Current llama.cpp version has already been built."
